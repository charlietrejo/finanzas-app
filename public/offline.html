<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Sin conexión — Northstar Finance</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        padding: 24px;
        text-align: center;
        background: #f5f6f8;
        color: #333333;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      }
      .logo {
        width: 64px;
        height: 64px;
        border-radius: 16px;
        background: #6161ff;
        color: #ffffff;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        font-size: 28px;
      }
      h1 {
        font-size: 20px;
        font-weight: 500;
        margin: 0;
      }
      p {
        color: #535768;
        margin: 0;
        max-width: 320px;
      }
      button {
        border: none;
        border-radius: 160px;
        background: #6161ff;
        color: #ffffff;
        padding: 12px 24px;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="logo">N</div>
    <h1>Sin conexión</h1>
    <p>No hay internet en este momento. Revisa tu conexión e intenta de nuevo — tus datos están seguros en la nube.</p>
    <button onclick="location.reload()">Reintentar</button>
  </body>
</html>
